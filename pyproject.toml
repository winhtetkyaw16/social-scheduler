[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "social-scheduler"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13,<2", "bcrypt>=4.0.1,<4.1", "celery[redis]>=5.3,<6", "cryptography>=42,<46",
  "email-validator>=2,<3", "fastapi>=0.110,<1", "httpx>=0.27,<1",
  "passlib[bcrypt]>=1.7,<2", "psycopg[binary]>=3.1,<4", "python-dotenv>=1,<2",
  "python-jose[cryptography]>=3.3,<4", "python-multipart>=0.0.9", "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.29,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
