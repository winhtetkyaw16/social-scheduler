# Compose runs the API and worker against Postgres so they do not share a SQLite file.
# Copy .env.example to .env for OAuth client secrets. Database, Redis, and broker URLs
# below override .env so both processes use the same Postgres instance.
x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://social:social@db:5432/social_scheduler
  CELERY_BROKER_URL: redis://redis:6379/1
  REDIS_URL: redis://redis:6379/0

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: social
      POSTGRES_PASSWORD: social
      POSTGRES_DB: social_scheduler
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U social -d social_scheduler"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - uploads:/app/frontend/static/uploads
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    volumes:
      - uploads:/app/frontend/static/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      api:
        condition: service_healthy
    command: celery -A app.tasks.celery_app:celery_app worker --loglevel=INFO
  beat:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      <<: *app-env
    depends_on:
      redis:
        condition: service_started
    command: celery -A app.tasks.celery_app:celery_app beat --loglevel=INFO
  redis:
    image: redis:7-alpine
    restart: unless-stopped

volumes:
  postgres-data:
  uploads:
